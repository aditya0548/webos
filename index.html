      true: { run() { return { code: 0 }; } },
      false: { run() { return { code: 1 }; } },

      tree: {
        run(args, stdin, ctx) {
          const target = args[0] || ctx.proc.cwd;
          const node = Kernel.fs.resolve(target, ctx.proc.cwd);
          if (!node) return { stderr: `no such file or directory: ${target}`, code: 1 };
          if (node.type !== 'dir') return { stderr: `not a directory: ${target}`, code: 1 };
          const canonical = Kernel.fs.normalize(target, ctx.proc.cwd);
          const lines = [canonical, ...formatTreeOutput(node)];
          const subCount = Kernel.fs.count();
          lines.push(`\n${subCount.dirs} directories, ${subCount.files} files`);
          return { stdout: lines.join('\n'), code: 0 };
        }
      },

      ps: {
        run() {
          const out = '  PID  NAME          CPU%     MEM       STATE     SCHEDS  PRIO\n' +
            Kernel.processes.map(p =>
              `  ${String(p.pid).padEnd(4)} ` +
              `${p.name.padEnd(13)} ` +
              `${String(p.cpu + '%').padEnd(8)} ` +
              `${String(p.mem + 'MB').padEnd(9)} ` +
              `${p.state.padEnd(9)} ` +
              `${String(p.schedCount).padEnd(7)} ` +
              `${p.priority}`
            ).join('\n');
          return { stdout: out, code: 0 };
        }
      },

      sched: {
        run() {
          const uptimeSec = ((Kernel.scheduler.totalTicks * Kernel.scheduler.quantumMs) / 1000).toFixed(1);
          const currProc = Kernel.processes.find(p => p.pid === Kernel.scheduler.currentPid);
          const currStr = currProc ? `pid ${currProc.pid} (${currProc.name})` : 'none';
          return {
            stdout: [
              'Scheduler: weighted round-robin',
              `Quantum: ${Kernel.scheduler.quantumMs}ms`,
              `Total ticks: ${Kernel.scheduler.totalTicks}`,
              `Uptime: ${uptimeSec}s`,
              `Currently running: ${currStr}`
            ].join('\n'),
            code: 0
          };
        }
      },

      queue: {
        run() {
          const candidates = Kernel.processes.filter(p => p.state === 'ready' || p.state === 'running');
          const pool = [];
          candidates.forEach(p => {
            const w = Math.max(1, Math.min(5, p.priority || 1));
            for (let i = 0; i < w; i++) pool.push({ pid: p.pid, name: p.name, prio: p.priority });
          });
          const lines = [`Weighted Pool (${pool.length} entries):`];
          pool.forEach((item, idx) => {
            const isCurrent = item.pid === Kernel.scheduler.currentPid;
            lines.push(`  [${String(idx + 1).padStart(2, ' ')}] pid ${item.pid} (${item.name}, prio ${item.prio})${isCurrent ? ' *RUNNING*' : ''}`);
          });
          lines.push(`Currently running: pid ${Kernel.scheduler.currentPid || 'none'}`);
          return { stdout: lines.join('\n'), code: 0 };
        }
      },

      kill: {
        run(args) {
          const targetPid = parseInt(args[0], 10);
          if (isNaN(targetPid)) return { stderr: 'usage: kill <pid>', code: 1 };
          const targetProc = Kernel.processes.find(p => p.pid === targetPid);
          if (!targetProc) return { stderr: `no such process: ${targetPid}`, code: 1 };
          Kernel.kill(targetPid);
          return { stdout: `killed process ${targetPid} (${targetProc.name})`, code: 0 };
        }
      },

      nice: {
        run(args) {
          const targetPid = parseInt(args[0], 10);
          const newPrio = parseInt(args[1], 10);
          if (isNaN(targetPid) || isNaN(newPrio)) return { stderr: 'usage: nice <pid> <priority>', code: 1 };
          if (newPrio < 1 || newPrio > 5) return { stderr: 'priority must be between 1 and 5', code: 1 };
          const targetProc = Kernel.processes.find(p => p.pid === targetPid);
          if (!targetProc) return { stderr: `no such process: ${targetPid}`, code: 1 };
          targetProc.priority = newPrio;
          return { stdout: `set priority of pid ${targetPid} (${targetProc.name}) to ${newPrio}`, code: 0 };
        }
      },

      log: {
        run() {
          launchKernelLog();
          return { code: 0 };
        }
      },

      clear: {
        run(args, stdin, ctx) {
          ctx.clearHistory();
          return { code: 0 };
        }
      },

      date: { run() { return { stdout: new Date().toString(), code: 0 }; } },
      whoami: { run() { return { stdout: 'user', code: 0 }; } },

      theme: {

            };
            return { stdout: JSON.stringify(exp, null, 2), code: 0 };
          }
          if (sub === 'save') {
            const name = args[1];
            if (!name) return { stderr: 'usage: theme save <name>', code: 1 };
            const docDir = '/home/user/Documents';
            try {
              if (!Kernel.fs.resolve(docDir, '/')) {

              }
            } catch (e) {}
            const s = Settings.current;
            const themeData = {

            };

              if (data.accent) Settings.set('accent', data.accent);

              if (data.motion) Settings.set('motion', data.motion);

              if (data.termLineHeight !== undefined) Settings.set('termLineHeight', data.termLineHeight);

          if (sub === 'list') {

      settings: {

    // Parser for a single command segment with redirection
    function parseSegment(seg) {
      const tokens = [];
      const regex = /"([^"]*)"|'([^']*)'|>>|>|<|(\S+)/g;
      let m;
      while ((m = regex.exec(seg)) !== null) {
        if (m[1] !== undefined) tokens.push(m[1]);
        else if (m[2] !== undefined) tokens.push(m[2]);
        else tokens.push(m[0]);
      }
      const words = [];
      let stdinFile = null, stdoutFile = null, appendStdout = false;

      for (let i = 0; i < tokens.length; i++) {
        const t = tokens[i];
        if (t === '<') { stdinFile = tokens[++i]; }
        else if (t === '>>') { stdoutFile = tokens[++i]; appendStdout = true; }
        else if (t === '>') { stdoutFile = tokens[++i]; appendStdout = false; }
        else if (t.startsWith('>>') && t.length > 2) { stdoutFile = t.slice(2); appendStdout = true; }
        else if (t.startsWith('>') && t.length > 1) { stdoutFile = t.slice(1); appendStdout = false; }
        else if (t.startsWith('<') && t.length > 1) { stdinFile = t.slice(1); }
        else { words.push(t); }
      }
      return { words, stdinFile, stdoutFile, appendStdout };
    }

    // Pipeline Execution Engine
    function executePipeline(rawLine, ctx) {
      if (rawLine.trim() === 'rm -rf /') {
        ctx.termState.awaitingWipeConfirm = true;
        return { stderr: "WARNING: this will destroy the entire filesystem. Type 'yes' to confirm.", code: 1 };
      }

      const segmentStrs = rawLine.split('|');
      const hasPipeOrRedirect = segmentStrs.length > 1 || rawLine.includes('>') || rawLine.includes('<');

      let currentStdin = null;
      let finalStdout = null;
      let finalStderr = null;
      let lastExitCode = 0;

      for (let i = 0; i < segmentStrs.length; i++) {
        const segStr = segmentStrs[i].trim();
        if (!segStr) {
          finalStderr = 'syntax error near unexpected token \'|\'';
          lastExitCode = 2;
          break;
        }

        const parsed = parseSegment(segStr);
        const { words, stdinFile, stdoutFile, appendStdout } = parsed;

        if (words.length === 0) {
          finalStderr = 'syntax error: empty command in pipeline';
          lastExitCode = 2;
          break;
        }

        const cmdName = words[0];
        const cmdArgs = words.slice(1);
        const cmdObj = Commands[cmdName];

        if (!cmdObj) {
          finalStderr = `command not found: ${cmdName}`;
          lastExitCode = 127;
          break;
        }

        let segStdin = currentStdin;
        if (stdinFile) {
          try {
            segStdin = Kernel.fs.read(stdinFile, ctx.proc.cwd);
          } catch (err) {
            finalStderr = `no such file or directory: ${stdinFile}`;
            lastExitCode = 1;
            break;
          }
        }

        const res = cmdObj.run(cmdArgs, segStdin, ctx);
        lastExitCode = res.code !== undefined ? res.code : 0;

        if (res.stderr) {
          finalStderr = finalStderr ? finalStderr + '\n' + res.stderr : res.stderr;
        }

        if (res.code !== 0 && !res.stdout && segmentStrs.length > 1) {
          currentStdin = null;
        } else {
          currentStdin = res.stdout !== undefined ? res.stdout : null;
        }

        if (stdoutFile) {
          const contentToWrite = res.stdout !== undefined && res.stdout !== null ? String(res.stdout) : '';
          try {
            const existing = Kernel.fs.resolve(stdoutFile, ctx.proc.cwd);
            if (existing && existing.type === 'file') {
              if (appendStdout) {
                existing.content += (existing.content.length > 0 && !existing.content.endsWith('\n') ? '\n' : '') + contentToWrite;
              } else {
                existing.content = contentToWrite;
              }
              Kernel.fs.save();
            } else {
              Kernel.fs.touch(stdoutFile, ctx.proc.cwd, contentToWrite);
            }
          } catch (err) {
            finalStderr = `cannot create file: ${stdoutFile}`;
            lastExitCode = 1;
            break;
          }
          currentStdin = null;
        }

        if (i === segmentStrs.length - 1 && !stdoutFile) {
          finalStdout = res.stdout !== undefined ? res.stdout : null;
        }
      }

      if (hasPipeOrRedirect) {
        const uptime = Kernel.scheduler.totalTicks * Kernel.scheduler.quantumMs;
        Kernel.scheduler.history.push(`[ ${String(uptime).padStart(5, ' ')}ms] pipe: ${rawLine.trim()} (exit ${lastExitCode})`);
        if (Kernel.scheduler.history.length > 200) Kernel.scheduler.history.shift();
      }

      return { stdout: finalStdout, stderr: finalStderr, code: lastExitCode };
    }

    // App 1: Terminal Application
    function launchTerminal() {
      const pid = Kernel.spawn('terminal', 1, 22.0, '/home/user');
      const proc = Kernel.processes.find(p => p.pid === pid);

      const container = document.createElement('div');
      container.className = 'terminal-container';

      const historyContainer = document.createElement('div');
      historyContainer.className = 'term-history';
      const welcome = document.createElement('div');
      welcome.className = 'term-line';
      welcome.textContent = 'WebOS v5 Terminal (macOS Streams & Pipes). Type "help" for a list of commands.\n';
      historyContainer.appendChild(welcome);

      const escapeHtml = str => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const getPromptHtml = () => {
        const pathPart = Settings.current.termShowPath ? `<span class="term-prompt-path">${escapeHtml(proc.cwd)}</span>` : '';
        return `<span class="term-prompt-symbol">user@webos:</span>${pathPart}<span class="term-prompt-symbol">$</span>`;
      };

      const promptRow = document.createElement('div');
      promptRow.className = 'term-prompt-row';
      promptRow.innerHTML = `<span class="term-prompt-wrap">${getPromptHtml()}</span> <input type="text" class="term-input" spellcheck="false" autocomplete="off" autofocus />`;

      container.appendChild(historyContainer);
      container.appendChild(promptRow);

      const promptWrap = promptRow.querySelector('.term-prompt-wrap');
      const input = promptRow.querySelector('.term-input');
      container.addEventListener('click', () => { if (!input.disabled) input.focus(); });

      const updatePrompt = () => { promptWrap.innerHTML = getPromptHtml(); };

      const termState = { awaitingWipeConfirm: false, locked: false };
      const commandHistory = [];
      let historyIndex = -1;
      let tempInput = '';

      const ctx = {
        proc,
        termState,
        commandHistory,
        updatePrompt,
        clearHistory: () => { historyContainer.innerHTML = ''; }
      };

      input.addEventListener('keydown', (e) => {
        // Ctrl+L shortcut to clear terminal
        if (e.ctrlKey && e.key.toLowerCase() === 'l') {
          e.preventDefault();
          historyContainer.innerHTML = '';
          container.scrollTop = container.scrollHeight;
          return;
        }

        // Ctrl+C shortcut to cancel line
        if (e.ctrlKey && e.key.toLowerCase() === 'c') {
          e.preventDefault();
          const commandLine = document.createElement('div');
          commandLine.className = 'term-line';
          commandLine.innerHTML = `<span class="term-prompt-wrap">${getPromptHtml()}</span> ${escapeHtml(input.value)}^C`;
          historyContainer.appendChild(commandLine);
          input.value = '';
          historyIndex = -1;
          container.scrollTop = container.scrollHeight;
          return;
        }

        // Up arrow: navigate backward in command history
        if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (commandHistory.length === 0) return;
          if (historyIndex === -1) tempInput = input.value;
          if (historyIndex < commandHistory.length - 1) {
            historyIndex++;
            input.value = commandHistory[commandHistory.length - 1 - historyIndex];
          }
          return;
        }

        // Down arrow: navigate forward in command history
        if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (historyIndex > 0) {
            historyIndex--;
            input.value = commandHistory[commandHistory.length - 1 - historyIndex];
          } else if (historyIndex === 0) {
            historyIndex = -1;
            input.value = tempInput;
          }
          return;
        }

        if (e.key === 'Enter') {
          if (termState.locked) return;
          const raw = input.value;
          const trimmed = raw.trim();

          const commandLine = document.createElement('div');
          commandLine.className = 'term-line';
          commandLine.innerHTML = `<span class="term-prompt-wrap">${getPromptHtml()}</span> ${escapeHtml(raw)}`;
          historyContainer.appendChild(commandLine);

          if (termState.awaitingWipeConfirm) {
            if (trimmed.toLowerCase() === 'yes') {
              Kernel.fs.wipe();
              const outDiv = document.createElement('div');
              outDiv.className = 'term-output error-msg';
              outDiv.textContent = 'Filesystem destroyed. Reload to rebuild.';
              historyContainer.appendChild(outDiv);
              termState.locked = true;
              input.disabled = true;
              promptRow.style.display = 'none';
              container.scrollTop = container.scrollHeight;
              return;
            } else {
              const outDiv = document.createElement('div');
              outDiv.className = 'term-output';
              outDiv.textContent = 'aborted.';
              historyContainer.appendChild(outDiv);
              termState.awaitingWipeConfirm = false;
              input.value = '';
              container.scrollTop = container.scrollHeight;
              return;
            }
          }

          if (trimmed === '') {
            input.value = '';
            container.scrollTop = container.scrollHeight;
            return;
          }

          commandHistory.push(raw);
          historyIndex = -1;

          const res = executePipeline(raw, ctx);

          if (res.stdout) {
            const outDiv = document.createElement('div');
            outDiv.className = 'term-output';
            outDiv.textContent = res.stdout;
            historyContainer.appendChild(outDiv);
          }

          if (res.stderr) {
            const outDiv = document.createElement('div');
            outDiv.className = 'term-output error-msg';
            outDiv.textContent = res.stderr;
            historyContainer.appendChild(outDiv);
          }

          input.value = '';
          container.scrollTop = container.scrollHeight;
        }
      });

      WindowManager.createWindow({ title: 'Terminal', pid, width: 540, height: 360, contentEl: container, appKey: 'terminal' });
      setTimeout(() => input.focus(), 50);
    }

    // App 2: Kernel Log Application
    function launchKernelLog() {
      const existing = WindowManager.windows.find(w => w.title === 'Kernel Log');
      if (existing) {
        WindowManager.restore(existing.el);
        return;
      }

      const pid = Kernel.spawn('kernellog', 1, 14.0);
      const container = document.createElement('div');
      container.className = 'kernellog-container';
      let winEl = null;

      let lastSeenHistoryLength = 0;
      let rafPending = false;

      const appendNewEntries = () => {
        if (!Kernel || !Kernel.scheduler || !Kernel.scheduler.history) return;
        const history = Kernel.scheduler.history;
        const total = history.length;
        if (total === lastSeenHistoryLength) {
          rafPending = false;
          return;
        }

        let startIdx = lastSeenHistoryLength;
        if (lastSeenHistoryLength === 0 || lastSeenHistoryLength > total) {
          container.textContent = '';
          startIdx = Math.max(0, total - 200);
        }

        const frag = document.createDocumentFragment();
        for (let i = startIdx; i < total; i++) {
          const lineDiv = document.createElement('div');
          lineDiv.textContent = history[i];
          frag.appendChild(lineDiv);
        }
        container.appendChild(frag);
        lastSeenHistoryLength = total;

        while (container.childElementCount > 200) {
          container.removeChild(container.firstChild);
        }
        container.scrollTop = container.scrollHeight;
        rafPending = false;
      };

      const renderLog = () => {
        if (document.visibilityState === 'hidden') return;
        if (winEl && (winEl.style.display === 'none' || !winEl.isConnected)) return;
        if (!rafPending) {
          rafPending = true;
          requestAnimationFrame(appendNewEntries);
        }
      };
      renderLog();

      const refreshIntervalId = setInterval(renderLog, 500);

      winEl = WindowManager.createWindow({
        title: 'Kernel Log',
        pid,
        width: 500,
        height: 330,
        contentEl: container,
        appKey: 'kernellog',
        onClose: () => { clearInterval(refreshIntervalId); }
      });
    }

    // App 3: Task Manager Application
    function launchTaskManager() {
      const existing = WindowManager.windows.find(w => w.title === 'Task Manager');
      if (existing) {
        WindowManager.restore(existing.el);
        return;
      }

      const pid = Kernel.spawn('taskmgr', 1, 28.5);
      const container = document.createElement('div');
      container.className = 'taskmgr-container';
      let winEl = null;

      const summaryDiv = document.createElement('div');
      summaryDiv.className = 'taskmgr-header-summary';
      summaryDiv.innerHTML = `
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px;">
          <span><strong>Processes:</strong> <span class="tm-stat-procs">0</span> | <strong>Scheduler:</strong> RR (q=${Kernel.scheduler.quantumMs}ms) | <strong>Currently:</strong> <span class="tm-stat-curr">none</span> | <strong>Uptime:</strong> <span class="tm-stat-uptime">0.0</span>s</span>
        </div>
        <div style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px; color:var(--text-muted);">
          <span><strong>Filesystem:</strong> <span class="tm-stat-fs">0 dirs, 0 files</span></span>
          <span><strong>Total CPU:</strong> <span class="tm-stat-cpu">0.0</span>% | <strong>Total Mem:</strong> <span class="tm-stat-mem">0.0</span> MB</span>
        </div>
      `;
      const statProcs = summaryDiv.querySelector('.tm-stat-procs');
      const statCurr = summaryDiv.querySelector('.tm-stat-curr');
      const statUptime = summaryDiv.querySelector('.tm-stat-uptime');
      const statFs = summaryDiv.querySelector('.tm-stat-fs');
      const statCpu = summaryDiv.querySelector('.tm-stat-cpu');
      const statMem = summaryDiv.querySelector('.tm-stat-mem');

      const table = document.createElement('table');
      table.className = 'taskmgr-table';
      table.innerHTML = `
        <thead>
          <tr><th>PID</th><th>Name</th><th>CPU%</th><th>Mem</th><th>State</th><th>Scheds</th><th>Prio</th></tr>
        </thead>
        <tbody id="taskmgr-tbody"></tbody>
      `;
      container.appendChild(summaryDiv);
      container.appendChild(table);

      const tbody = table.querySelector('tbody');
      const rowMap = new Map();
      let rafPending = false;

      const updateDom = () => {
        let totalCpu = 0, totalMem = 0;
        const currentPids = new Set();

        Kernel.processes.forEach(p => {
          totalCpu += p.cpu;
          totalMem += p.mem;
          currentPids.add(p.pid);

          const isRunning = p.state === 'running';
          const badgeClass = isRunning ? 'badge-running' : (p.state === 'blocked' ? 'badge-blocked' : 'badge-ready');
          let row = rowMap.get(p.pid);

          if (!row) {
            const tr = document.createElement('tr');
            tr.className = isRunning ? 'is-running' : '';
            tr.innerHTML = `
              <td>${p.pid}</td>
              <td style="font-weight:600; color:var(--text-main);">${p.name}</td>
              <td class="cell-cpu" style="color:var(--accent); font-weight:500;">${p.cpu.toFixed(1)}%</td>
              <td class="cell-mem" style="color:var(--text-muted);">${p.mem.toFixed(1)} MB</td>
              <td><span class="${badgeClass}">${p.state.toUpperCase()}</span></td>
              <td class="cell-sched">${p.schedCount}</td>
              <td>${p.priority}</td>
            `;
            tbody.appendChild(tr);
            row = {
              tr,
              cpuTd: tr.querySelector('.cell-cpu'),
              memTd: tr.querySelector('.cell-mem'),
              badgeSpan: tr.querySelector('span'),
              schedTd: tr.querySelector('.cell-sched')
            };
            rowMap.set(p.pid, row);
          } else {
            if (row.tr.className !== (isRunning ? 'is-running' : '')) {
              row.tr.className = isRunning ? 'is-running' : '';
            }
            const cpuStr = p.cpu.toFixed(1) + '%';
            if (row.cpuTd.textContent !== cpuStr) row.cpuTd.textContent = cpuStr;

            const memStr = p.mem.toFixed(1) + ' MB';
            if (row.memTd.textContent !== memStr) row.memTd.textContent = memStr;

            const stateStr = p.state.toUpperCase();
            if (row.badgeSpan.textContent !== stateStr) row.badgeSpan.textContent = stateStr;
            if (row.badgeSpan.className !== badgeClass) row.badgeSpan.className = badgeClass;

            const schedStr = String(p.schedCount);
            if (row.schedTd.textContent !== schedStr) row.schedTd.textContent = schedStr;
          }
        });

        for (const [pid, row] of rowMap.entries()) {
          if (!currentPids.has(pid)) {
            if (row.tr.parentNode) row.tr.parentNode.removeChild(row.tr);
            rowMap.delete(pid);
          }
        }

        const fsStats = Kernel.fs.count();
        const uptimeSec = ((Kernel.scheduler.totalTicks * Kernel.scheduler.quantumMs) / 1000).toFixed(1);
        const currProc = Kernel.processes.find(p => p.pid === Kernel.scheduler.currentPid);
        const currDesc = currProc ? `pid ${currProc.pid} (${currProc.name})` : 'none';

        if (statProcs) statProcs.textContent = Kernel.processes.length;
        if (statCurr) statCurr.textContent = currDesc;
        if (statUptime) statUptime.textContent = uptimeSec;
        if (statFs) statFs.textContent = `${fsStats.dirs} dirs, ${fsStats.files} file${fsStats.files === 1 ? '' : 's'}`;
        if (statCpu) statCpu.textContent = Math.min(100, totalCpu).toFixed(1);
        if (statMem) statMem.textContent = totalMem.toFixed(1);

        rafPending = false;
      };

      const renderProcesses = () => {
        if (document.visibilityState === 'hidden') return;
        if (winEl && (winEl.style.display === 'none' || !winEl.isConnected)) return;
        if (!rafPending) {
          rafPending = true;
          requestAnimationFrame(updateDom);
        }
      };

      renderProcesses();
      const refreshIntervalId = setInterval(renderProcesses, 800);

      winEl = WindowManager.createWindow({
        title: 'Task Manager',
        pid,
        width: 520,
        height: 350,
        contentEl: container,
        appKey: 'taskmgr',
        onClose: () => { clearInterval(refreshIntervalId); }
      });
    }

        glass: { icon: 'droplet', title: 'Liquid Glass', subtitle: 'macOS 27 Golden Gate system transparency and glass blur', target: 'row-glass' },
        font: { icon: 'type', title: 'Terminal Font', subtitle: 'Adjust terminal font size and typography line height', target: 'row-font' },
        behavior: { icon: 'terminal', title: 'Terminal Behavior', subtitle: 'Configure prompt display and shell interaction', target: 'row-path' },
        motion: { icon: 'activity', title: 'Motion', subtitle: 'Control window animations and motion speed', target: 'row-motion' },
        reset: { icon: 'trash', title: 'System Reset', subtitle: 'Restore WebOS settings to system defaults', target: 'row-reset' }
      };

      const selectSection = (secKey) => {
        const info = sectionInfo[secKey] || sectionInfo.appearance;
        container.querySelectorAll('.settings-nav-row').forEach(row => {
          row.classList.toggle('active', row.dataset.section === secKey);
        });
        const hdrIcon = container.querySelector('#settings-hdr-icon');
        const hdrTitle = container.querySelector('#settings-hdr-title');
        const hdrSub = container.querySelector('#settings-hdr-subtitle');
        if (hdrIcon) hdrIcon.innerHTML = getIconSvg(info.icon, 48);
        if (hdrTitle) hdrTitle.textContent = info.title;
        if (hdrSub) hdrSub.textContent = info.subtitle;

        const targetEl = container.querySelector('#' + info.target);
        if (targetEl) {
          targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
      };

      container.querySelectorAll('.settings-nav-row').forEach(row => {
        row.addEventListener('click', () => { selectSection(row.dataset.section); });
      });

      // Sync active state in UI
      renderSettingsUi = () => {
        const s = Settings.current;
        container.querySelectorAll('#ctrl-mode .segmented-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.mode === s.mode);
        });
        container.querySelectorAll('#ctrl-motion .segmented-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.motion === s.motion);
        });
        container.querySelectorAll('#ctrl-accent .accent-swatch').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.accent === s.accent);
        });
        container.querySelectorAll('#ctrl-wallpaper .wallpaper-tile').forEach(tile => {
          tile.classList.toggle('active', tile.dataset.wallpaper === s.wallpaper);
        });
        if (glassSlider) glassSlider.value = s.glassOpacity ?? 0.8;
        if (glassLabel) glassLabel.textContent = (s.glassOpacity !== undefined ? s.glassOpacity : 0.8).toFixed(2);
        if (fontSlider) fontSlider.value = s.termFontSize;
        if (fontLabel) fontLabel.textContent = s.termFontSize + 'px';
        if (lhSlider) lhSlider.value = s.termLineHeight || 1.5;
        if (lhLabel) lhLabel.textContent = (s.termLineHeight || 1.5).toFixed(1);
        if (pathCheckbox) pathCheckbox.checked = !!s.termShowPath;
      };

      renderSettingsUi();

      WindowManager.createWindow({
        title: 'Settings',
        pid,
        width: 620,
        height: 460,
        contentEl: container,
        appKey: 'settings',
        onClose: () => { renderSettingsUi = () => {}; }
      });
    }

    // App 5: File Manager Application (Files) with Matios UI Integration
    function launchFiles(initialPath = '/home/user') {
      if (typeof initialPath !== 'string' || !initialPath) {
        const shellProc = (typeof Kernel !== 'undefined' && Kernel.processes) ? Kernel.processes.find(p => p.name === 'shell') : null;
        initialPath = (shellProc && shellProc.cwd) ? shellProc.cwd : '/home/user';
      }
      const existing = WindowManager.windows.find(w => w.appKey === 'files');
      if (existing) {
        WindowManager.restore(existing.el);
        if (existing.navigateTo) existing.navigateTo(initialPath);
        return;
      }

      const pid = Kernel.spawn('files', 2, 20.0, initialPath);
      let currentPath = Kernel.fs.normalize(initialPath);
      let viewMode = 'grid';
      let history = [currentPath];
      let historyIdx = 0;
      let searchQuery = '';
      let selectedItem = null;
      let toastTimer = null;
      let winEl = null;

      const container = document.createElement('div');
      container.className = 'files-container';
      container.innerHTML = `
        <div class="files-toolbar">
          <div class="files-toolbar-nav">
            <button class="mts-btn files-nav-btn" id="files-btn-back" title="Back">${getIconSvg('chevronLeft', 14)}</button>
            <button class="mts-btn files-nav-btn" id="files-btn-forward" title="Forward">${getIconSvg('chevronRight', 14)}</button>
            <div class="files-breadcrumbs" id="files-breadcrumbs"></div>
          </div>
          <div class="files-toolbar-actions">
            <div class="mts-btn-group" id="files-view-toggle">
              <button class="mts-btn active" data-view="grid" title="Icon View">${getIconSvg('grid', 14)}</button>
              <button class="mts-btn" data-view="list" title="List View">${getIconSvg('list', 14)}</button>
            </div>
            <button class="mts-btn" id="files-btn-new-folder" title="New Folder">${getIconSvg('plus', 14)} New Folder</button>
            <div class="files-search-wrap">
              <span class="files-search-icon">${getIconSvg('search', 12)}</span>
              <input class="files-search-input mts-input" id="files-search-input" placeholder="Search" />
            </div>
          </div>
        </div>
        <div class="files-body">
          <div class="files-sidebar">
            <div class="files-sidebar-section">Favorites</div>
            <div class="files-sidebar-row" data-path="/home/user">${getIconSvg('home', 14)} <span>Home</span></div>
            <div class="files-sidebar-row" data-path="/home/user/Desktop">${getIconSvg('monitor', 14)} <span>Desktop</span></div>
            <div class="files-sidebar-row" data-path="/home/user/Documents">${getIconSvg('fileText', 14)} <span>Documents</span></div>
            <div class="files-sidebar-row" data-path="/home/user/Downloads">${getIconSvg('download', 14)} <span>Downloads</span></div>
            <div class="files-sidebar-section">Locations</div>
            <div class="files-sidebar-row" data-path="/">${getIconSvg('hardDrive', 14)} <span>Root (/)</span></div>
            <div class="files-sidebar-row" data-path="/bin">${getIconSvg('folder', 14)} <span>Bin</span></div>
            <div class="files-sidebar-row" data-path="/etc">${getIconSvg('folder', 14)} <span>Etc</span></div>
            <div class="files-sidebar-row" data-path="/tmp">${getIconSvg('folder', 14)} <span>Tmp</span></div>
          </div>
          <div class="files-content" id="files-content"></div>
        </div>
        <div class="files-toast" id="files-toast"></div>
        <div class="mts-modal-backdrop modal-backdrop" id="files-delete-modal">
          <div class="mts-modal modal-box">
            <div class="mts-modal__title modal-title" id="files-del-title">Delete Item?</div>
            <div class="mts-modal__body modal-desc" id="files-del-desc">Are you sure you want to permanently delete this item?</div>
            <div class="mts-modal__footer modal-btns">
              <button class="mts-btn mts-btn--secondary btn-modal btn-modal-cancel" id="files-del-cancel">Cancel</button>
              <button class="mts-btn mts-btn--danger btn-modal btn-modal-danger" id="files-del-confirm">Delete</button>
            </div>
          </div>
        </div>
        <div class="mts-ctx-menu" id="files-ctx-menu" style="display:none;"></div>
      `;

      const btnBack = container.querySelector('#files-btn-back');
      const btnForward = container.querySelector('#files-btn-forward');
      const breadcrumbsEl = container.querySelector('#files-breadcrumbs');
      const contentEl = container.querySelector('#files-content');
      const searchInput = container.querySelector('#files-search-input');
      const toastEl = container.querySelector('#files-toast');
      const deleteModal = container.querySelector('#files-delete-modal');
      const delConfirmBtn = container.querySelector('#files-del-confirm');
      const delCancelBtn = container.querySelector('#files-del-cancel');
      const ctxMenu = container.querySelector('#files-ctx-menu');

      let pendingDeleteTarget = null;

      function showToast(msg) {
        if (toastTimer) clearTimeout(toastTimer);
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
      }

      function hideCtxMenu() {
        ctxMenu.style.display = 'none';
        ctxMenu.innerHTML = '';
      }

      function showContextMenu(e, item) {
        e.preventDefault();
        e.stopPropagation();
        hideCtxMenu();

        const items = [];
        if (item) {
          items.push({ label: 'Open', icon: 'chevron', action: () => openItem(item) });
          items.push({ label: 'New Folder', icon: 'plus', action: () => createNewFolder() });
          items.push({ label: 'Rename', icon: 'edit', action: () => startRename(item.name) });
          items.push({ label: 'Duplicate', icon: 'copy', action: () => duplicateItem(item.name) });
          items.push({ label: 'Copy Path', icon: 'fileText', action: () => copyItemPath(item.name) });
          items.push({ separator: true });
          items.push({ label: 'Delete', icon: 'trash', danger: true, action: () => promptDelete(item.name) });
        } else {
          items.push({ label: 'New Folder', icon: 'plus', action: () => createNewFolder() });
          items.push({ label: 'Open in Terminal', icon: 'terminal', action: () => { launchTerminal(); } });
        }

        items.forEach(it => {
          if (it.separator) {
            const sep = document.createElement('div');
            sep.className = 'mts-ctx-menu__separator';
            ctxMenu.appendChild(sep);
          } else {
            const row = document.createElement('div');
            row.className = 'mts-ctx-menu__item' + (it.danger ? ' mts-ctx-menu__item--danger' : '');
            row.innerHTML = `${getIconSvg(it.icon, 13)} <span>${it.label}</span>`;
            row.addEventListener('click', (ev) => {
              ev.stopPropagation();
              hideCtxMenu();
              it.action();
            });
            ctxMenu.appendChild(row);
          }
        });

        ctxMenu.style.display = 'block';
        const rect = container.getBoundingClientRect();
        const menuX = Math.min(e.clientX, rect.right - 160);
        const menuY = Math.min(e.clientY, rect.bottom - 180);
        ctxMenu.style.left = menuX + 'px';
        ctxMenu.style.top = menuY + 'px';
      }

      function renderBreadcrumbs() {
        breadcrumbsEl.innerHTML = '';
        const parts = currentPath === '/' ? [] : currentPath.split('/').filter(Boolean);

        const rootCrumb = document.createElement('span');
        rootCrumb.className = 'files-crumb' + (currentPath === '/' ? ' active' : '');
        rootCrumb.textContent = '/';
        rootCrumb.addEventListener('click', () => navigateTo('/'));
        breadcrumbsEl.appendChild(rootCrumb);

        let accum = '';
        parts.forEach((part, idx) => {
          accum += '/' + part;
          const target = accum;
          const sep = document.createElement('span');
          sep.className = 'files-crumb-sep';
          sep.textContent = '>';
          breadcrumbsEl.appendChild(sep);

          const crumb = document.createElement('span');
          crumb.className = 'files-crumb' + (idx === parts.length - 1 ? ' active' : '');
          crumb.textContent = part;
          crumb.addEventListener('click', () => navigateTo(target));
          breadcrumbsEl.appendChild(crumb);
        });

        btnBack.disabled = historyIdx <= 0;
        btnForward.disabled = historyIdx >= history.length - 1;
      }

      function renderSidebar() {
        container.querySelectorAll('.files-sidebar-row').forEach(row => {
          row.classList.toggle('active', row.dataset.path === currentPath);
        });
      }

      function formatSize(bytes) {
        if (bytes === 0) return '0 B';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
      }

      function formatDate(ms) {
        const d = new Date(ms || Date.now());
        const pad = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function openItem(item) {
        if (item.type === 'dir') {
          navigateTo(Kernel.fs.normalize(item.name, currentPath));
        } else {
          showToast('No app to open this file yet');
        }
      }

      function createNewFolder() {
        let base = 'New Folder';
        let name = base;
        let count = 2;
        while (true) {
          try {
            Kernel.fs.mkdir(name, currentPath);
            break;
          } catch (e) {
            name = `${base} ${count++}`;
          }
        }
        renderContent();
        startRename(name);
        showToast(`Created '${name}'`);
      }

      function duplicateItem(name) {
        try {
          const newName = Kernel.fs.duplicate(name, currentPath);
          renderContent();
          showToast(`Duplicated to '${newName}'`);
        } catch (e) {
          showToast(`Error: ${e.message}`);
        }
      }

      function copyItemPath(name) {
        const full = Kernel.fs.normalize(name, currentPath);
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(full).catch(() => {});
        }
        showToast(`Copied path: ${full}`);
      }

      function promptDelete(name) {
        pendingDeleteTarget = name;
        const targetNode = Kernel.fs.resolve(name, currentPath);
        if (targetNode && targetNode.type === 'dir' && Object.keys(targetNode.children || {}).length > 0) {
          container.querySelector('#files-del-title').textContent = 'Delete Folder?';
          container.querySelector('#files-del-desc').textContent = `Are you sure you want to delete '${name}' and all its contents?`;
          deleteModal.classList.add('open');
        } else {
          try {
            Kernel.fs.remove(name, currentPath, true);
            renderContent();
            showToast(`Deleted '${name}'`);
          } catch (e) {
            showToast(`Delete failed: ${e.message}`);
          }
        }
      }

      delConfirmBtn.addEventListener('click', () => {
        if (pendingDeleteTarget) {
          try {
            Kernel.fs.remove(pendingDeleteTarget, currentPath, true);
            renderContent();
            showToast(`Deleted '${pendingDeleteTarget}'`);
          } catch (e) {
            showToast(`Delete failed: ${e.message}`);
          }
        }
        deleteModal.classList.remove('open');
        pendingDeleteTarget = null;
      });

      delCancelBtn.addEventListener('click', () => {
        deleteModal.classList.remove('open');
        pendingDeleteTarget = null;
      });

      function startRename(name) {
        const itemEl = contentEl.querySelector(`[data-name="${CSS.escape(name)}"]`);
        if (!itemEl) return;
        const labelEl = itemEl.querySelector('.files-rename-target');
        if (!labelEl) return;

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'files-rename-input';
        input.value = name;
        labelEl.replaceWith(input);
        input.focus();
        input.select();

        let committed = false;
        const commit = () => {
          if (committed) return;
          committed = true;
          const newName = input.value.trim();
          if (newName && newName !== name) {
            try {
              Kernel.fs.rename(name, newName, currentPath);
              showToast(`Renamed to '${newName}'`);
            } catch (e) {
              showToast(`Rename error: ${e.message}`);
            }
          }
          renderContent();
        };

        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { committed = true; renderContent(); }
        });
        input.addEventListener('blur', commit);
      }

      function renderContent() {
        hideCtxMenu();
        selectedItem = null;
        const currNode = Kernel.fs.resolve(currentPath, '/');
        if (!currNode || currNode.type !== 'dir') {
          contentEl.innerHTML = `<div class="files-empty">${getIconSvg('info', 28)} <span>Directory not found</span></div>`;
          return;
        }

        let items = Object.values(currNode.children || {}).sort((a, b) => {
          if (a.type !== b.type) return a.type === 'dir' ? -1 : 1;
          return a.name.localeCompare(b.name);
        });

        if (searchQuery) {
          items = items.filter(it => it.name.toLowerCase().includes(searchQuery));
        }

        if (items.length === 0) {
          contentEl.innerHTML = `<div class="files-empty">${getIconSvg('folder', 32)} <span>${searchQuery ? 'No matching items' : 'Folder is empty'}</span></div>`;
          return;
        }

        if (viewMode === 'grid') {
          const grid = document.createElement('div');
          grid.className = 'files-grid';
          items.forEach(it => {
            const itemEl = document.createElement('div');
            itemEl.className = 'files-grid-item';
            itemEl.dataset.name = it.name;
            const iconSvg = it.type === 'dir' ? getIconSvg('folder', 40) : getIconSvg('fileText', 40);
            itemEl.innerHTML = `
              <div class="files-grid-icon">${iconSvg}</div>
              <div class="files-grid-label files-rename-target">${escapeHtml(it.name)}</div>
            `;
            itemEl.addEventListener('click', (e) => {
              e.stopPropagation();
              grid.querySelectorAll('.files-grid-item').forEach(x => x.classList.remove('selected'));
              itemEl.classList.add('selected');
              selectedItem = it;
            });
            itemEl.addEventListener('dblclick', (e) => {
              e.stopPropagation();
              openItem(it);
            });
            itemEl.addEventListener('contextmenu', (e) => {
              grid.querySelectorAll('.files-grid-item').forEach(x => x.classList.remove('selected'));
              itemEl.classList.add('selected');
              selectedItem = it;
              showContextMenu(e, it);
            });
            grid.appendChild(itemEl);
          });
          contentEl.innerHTML = '';
          contentEl.appendChild(grid);
        } else {
          const table = document.createElement('table');
          table.className = 'files-list-table';
          table.innerHTML = `
            <thead>
              <tr>
                <th style="width:50%;">Name</th>
                <th style="width:22%;">Size</th>
                <th style="width:28%;">Modified</th>
              </tr>
            </thead>
            <tbody></tbody>
          `;
          const tbody = table.querySelector('tbody');
          items.forEach(it => {
            const tr = document.createElement('tr');
            tr.dataset.name = it.name;
            const iconSvg = it.type === 'dir' ? getIconSvg('folder', 16) : getIconSvg('fileText', 16);
            const sizeStr = it.type === 'dir' ? '--' : formatSize(it.content ? it.content.length : 0);
            const dateStr = formatDate(it.mtime);
            tr.innerHTML = `
              <td>
                <div class="files-list-name-cell">
                  <span style="color:var(--accent);">${iconSvg}</span>
                  <span class="files-rename-target">${escapeHtml(it.name)}</span>
                </div>
              </td>
              <td style="color:var(--text-muted); font-family:var(--font-mono);">${sizeStr}</td>
              <td style="color:var(--text-muted); font-family:var(--font-mono);">${dateStr}</td>
            `;
            tr.addEventListener('click', (e) => {
              e.stopPropagation();
              tbody.querySelectorAll('tr').forEach(x => x.classList.remove('selected'));
              tr.classList.add('selected');
              selectedItem = it;
            });
            tr.addEventListener('dblclick', (e) => {
              e.stopPropagation();
              openItem(it);
            });
            tr.addEventListener('contextmenu', (e) => {
              tbody.querySelectorAll('tr').forEach(x => x.classList.remove('selected'));
              tr.classList.add('selected');
              selectedItem = it;
              showContextMenu(e, it);
            });
            tbody.appendChild(tr);
          });
          contentEl.innerHTML = '';
          contentEl.appendChild(table);
        }
      }

      function updateTitle() {
        const titleName = currentPath === '/' ? 'Files' : (currentPath.split('/').filter(Boolean).pop() || 'Files');
        if (winEl) {
          const t = winEl.querySelector('.window-title');
          if (t) t.textContent = titleName;
          const rec = WindowManager.windows.find(w => w.pid === pid);
          if (rec) rec.title = titleName;
        }
      }

      function navigateTo(newPath) {
        const canonical = Kernel.fs.normalize(newPath, '/');
        const node = Kernel.fs.resolve(canonical, '/');
        if (!node || node.type !== 'dir') {
          showToast(`Directory not found: ${canonical}`);
          return;
        }
        if (currentPath !== canonical) {
          history = history.slice(0, historyIdx + 1);
          history.push(canonical);
          historyIdx = history.length - 1;
          currentPath = canonical;
        }
        updateTitle();
        renderBreadcrumbs();
        renderSidebar();
        renderContent();
      }

      btnBack.addEventListener('click', () => {
        if (historyIdx > 0) {
          historyIdx--;
          currentPath = history[historyIdx];
          updateTitle();
          renderBreadcrumbs();
          renderSidebar();
          renderContent();
        }
      });

      btnForward.addEventListener('click', () => {
        if (historyIdx < history.length - 1) {
          historyIdx++;
          currentPath = history[historyIdx];
          updateTitle();
          renderBreadcrumbs();
          renderSidebar();
          renderContent();
        }
      });

      container.querySelector('#files-view-toggle').querySelectorAll('.mts-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelector('#files-view-toggle').querySelectorAll('.mts-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          viewMode = btn.dataset.view;
          renderContent();
        });
      });

      container.querySelector('#files-btn-new-folder').addEventListener('click', () => createNewFolder());

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        renderContent();
      });

      container.querySelectorAll('.files-sidebar-row').forEach(row => {
        row.addEventListener('click', () => navigateTo(row.dataset.path));
      });

      contentEl.addEventListener('click', () => {
        hideCtxMenu();
        contentEl.querySelectorAll('.selected').forEach(x => x.classList.remove('selected'));
        selectedItem = null;
      });

      contentEl.addEventListener('contextmenu', (e) => {
        if (e.target === contentEl || e.target.classList.contains('files-grid') || e.target.classList.contains('files-empty')) {
          showContextMenu(e, null);
        }
      });

      document.addEventListener('click', hideCtxMenu);

      const initialTitle = initialPath === '/' ? 'Files' : (initialPath.split('/').filter(Boolean).pop() || 'Files');
      winEl = WindowManager.createWindow({
        title: initialTitle,
        pid,
        width: 720,
        height: 480,
        contentEl: container,
        appKey: 'files',
        onClose: () => {
          document.removeEventListener('click', hideCtxMenu);
        }
      });
      winEl.navigateTo = navigateTo;

      navigateTo(initialPath);
    }

    // App 6: About Application
    function launchAbout() {
      const existing = WindowManager.windows.find(w => w.title === 'About');
      if (existing) {
        WindowManager.restore(existing.el);
        return;
      }

      const pid = Kernel.spawn('about', 1, 14.0);
      const container = document.createElement('div');
      container.className = 'about-container';
      container.innerHTML = `
        <div class="about-logo">${getIconSvg('info', 28)}</div>
        <div class="about-title">WebOS v6.2 (Golden Gate Edition)</div>
        <p class="about-desc">A browser-based operating system simulation built with vanilla HTML, CSS, JavaScript, and Matios UI. Featuring macOS Golden Gate Liquid Glass transparency, shareable theme JSON system, File Manager, RR scheduler, and persistent VFS.</p>
        <div class="about-meta">
          <div><strong>Kernel:</strong> WebOS microkernel v6.2.0 (Preemptive RR)</div>
          <div><strong>Shell:</strong> WebOS POSIX Shell with Streams & Theme CLI</div>
          <div><strong>Filesystem:</strong> Persistent Virtual In-Memory Tree with mtime</div>
          <div><strong>Architecture:</strong> x86_64 Browser Virtual Machine</div>
        </div>
      `;
      WindowManager.createWindow({ title: 'About', pid, width: 440, height: 330, contentEl: container, appKey: 'about' });
    }

    // --- 4. Boot Sequence & Initialization ---
    const bootLines = [
      "WebOS BIOS v0.6.2 (x86_64 Browser Emulation)",
      "CPU: Virtual JS Engine @ 3.20GHz [1 core, 1 scheduler]",
      "Memory check: 640K Base, 16384K Extended ... OK",
      "Initializing persistent storage from localStorage ... OK",
      "Loading theme configuration & user preferences ... OK",
      "Starting process scheduler ... OK",
      "Loading kernel image /boot/vmlinuz-webos ... OK",
      "Mounting root filesystem (tmpfs / VFS) ... OK",
      "Initializing stream pipeline architecture ... OK",
      "Starting system services: udevd, syslogd, dbus ... OK",
      "Launching userland display manager ... OK",
      "Welcome to WebOS v6.2!"
    ];

    function startBootSequence() {
      const bootScreen = document.getElementById('boot-screen');
      const bootLog = document.getElementById('boot-log');
      const desktop = document.getElementById('desktop');
      let lineIdx = 0;

      function printNextLine() {
        if (lineIdx < bootLines.length) {
          const lineEl = document.createElement('div');
          lineEl.className = 'boot-line';
          lineEl.textContent = bootLines[lineIdx++];
          bootLog.appendChild(lineEl);
          setTimeout(printNextLine, 180);
        } else {
          setTimeout(() => {
            bootScreen.classList.add('fade-out');
            desktop.classList.add('loaded');
            setTimeout(() => { bootScreen.style.display = 'none'; }, 450);
            initOperatingSystem();
          }, 300);
        }
      }
      printNextLine();
    }

    function initOperatingSystem() {
      window.Kernel = Kernel;
      window.Settings = Settings;
      window.WindowManager = WindowManager;
      Settings.load();
      Kernel.fs.load();
      Kernel.spawn('kernel', 5, 32.0, '/');
      Kernel.spawn('shell', 3, 16.0, '/home/user');
      Kernel.scheduler.start();

      // Populate Desktop & Taskbar Icons with SVGs
      [
        ['terminal', 'terminal'], ['files', 'folder'], ['taskmgr', 'activity'], ['kernellog', 'log'],
        ['settings', 'settings'], ['about', 'info']
      ].forEach(([app, icon]) => {
        const d = document.getElementById('icon-sym-' + app);
        if (d) d.innerHTML = getIconSvg(icon, 24);
        const t = document.getElementById('tb-icon-' + app);
        if (t) t.innerHTML = getIconSvg(icon, 18);
      });

      const clockEl = document.getElementById('taskbar-clock');
      const updateClock = () => { clockEl.textContent = (new Date()).toTimeString().slice(0, 5); };
      updateClock();
      setInterval(updateClock, 1000);

      const appLaunchers = {
        terminal: launchTerminal,
        files: launchFiles,
        taskmgr: launchTaskManager,
        kernellog: launchKernelLog,
        settings: launchSettings,
        about: launchAbout
      };
      Object.entries(appLaunchers).forEach(([app, fn]) => {
        const d = document.getElementById('icon-' + app);
        if (d) d.addEventListener('click', fn);
        const t = document.getElementById('taskbar-btn-' + app);
        if (t) t.addEventListener('click', () => {
          const w = WindowManager.windows.find(x => x.appKey === app);
          if (w && w.el.style.display === 'none') {
            WindowManager.restore(w.el);
          } else {
            fn();
          }
        });
      });
    }

    window.addEventListener('DOMContentLoaded', startBootSequence);
  </script>
</body>
</html>
